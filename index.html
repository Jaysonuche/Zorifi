    <style id="zorifi-startup-critical">html,body{margin:0;background:#080918}.zorifi-opening{position:fixed;inset:0;z-index:100001;display:grid;place-items:center;background:#080918;color:#fff;text-align:center;font-family:system-ui,sans-serif}.zorifi-opening[hidden]{display:none}.zorifi-opening-core{display:grid;place-items:center;width:min(64vw,280px);aspect-ratio:1;border:1px solid #a881ff77;border-radius:50%;box-shadow:0 0 45px #a881ff44}.zorifi-opening-mark{display:grid;place-items:center;width:36%;aspect-ratio:1;border-radius:27%;background:#17152b;box-shadow:0 0 28px #b66aff88}.zorifi-opening-mark img{display:block;width:100%;height:100%;border-radius:inherit;object-fit:cover}.zorifi-opening-copy{position:absolute;bottom:max(7vh,45px);display:grid;gap:7px;justify-items:center;letter-spacing:.3em;text-transform:uppercase}.zorifi-opening-copy strong{font-size:clamp(23px,4vw,39px)}.zorifi-opening-copy small{font-size:10px;letter-spacing:.12em;color:#d5b4f5}.zorifi-opening-retry[hidden]{display:none}</style>
    <link rel="manifest" href="manifest.webmanifest?v=231" />
    <link rel="icon" href="icons/favicon-64.png?v=231" type="image/png" />

  </head>
  <body>
    <div class="zorifi-opening" role="status" aria-label="Zorifi is opening" aria-busy="true">
      <div class="zorifi-opening-grid" aria-hidden="true"></div>
      <div class="zorifi-opening-core" aria-hidden="true"><div class="zorifi-opening-iris"></div><div class="zorifi-opening-mark"><img src="icons/icon-192.png?v=231" alt="" fetchpriority="high" /></div><div class="zorifi-opening-scan"></div></div>
      <div class="zorifi-opening-copy"><strong>ZORIFI</strong><small data-opening-status>Preparing your workspace</small><button class="zorifi-opening-retry" type="button" hidden>Reload Zorifi</button></div>
    </div>
    <script>
      (()=>{
        const gate=document.querySelector('.zorifi-opening'),retry=gate.querySelector('.zorifi-opening-retry');
        retry.addEventListener('click',()=>location.reload());
        window.addEventListener('error',event=>{
          const target=event.target;
          if(target instanceof HTMLScriptElement||(target instanceof HTMLLinkElement&&target.rel==='stylesheet')){
            gate.dataset.bootFailed='true';gate.setAttribute('aria-busy','false');
            gate.querySelector('[data-opening-status]').textContent='A required Zorifi file could not load. Check your connection and reload.';
            retry.hidden=false;
          }
        },true);
      })();
    </script>
